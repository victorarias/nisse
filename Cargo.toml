[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SolenesInc/nisse"

[workspace.dependencies]
nisse-protocol = { path = "crates/nisse-protocol" }
nisse-core = { path = "crates/nisse-core" }
nisse-lua = { path = "crates/nisse-lua" }
nisse-server = { path = "crates/nisse-server" }
nisse-client = { path = "crates/nisse-client" }
nisse-tui = { path = "crates/nisse-tui" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
insta = "1"
globset = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mlua = { version = "0.12", features = ["luau", "send", "serde"] }
ratatui = "0.30"
regex = "1"
rustix = { version = "1", features = ["process"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
uuid = { version = "1", features = ["v7", "serde"] }
vt100 = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
