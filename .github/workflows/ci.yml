name: ci

on:
  pull_request:

jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p "$RUNNER_TEMP/leak"
          for i in 1 2 3 4 5 6 7 8; do LEAK_DIR="$RUNNER_TEMP/leak" bun packages/conformance/check.ts || true; done
          ls -la "$RUNNER_TEMP/leak"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leak-snapshots
          path: ${{ runner.temp }}/leak
          if-no-files-found: ignore
